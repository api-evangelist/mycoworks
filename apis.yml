name: Mycoworks
description: MycoWorks is a San Francisco Bay Area biotechnology and advanced-materials
  company founded in 2013 by artist Philip Ross and Sophia Wang, headquartered in Emeryville,
  California. It engineers premium leather-alternative biomaterials from mycelium using
  its patented Fine Mycelium process, sold under the Reishi brand to luxury fashion,
  automotive, and design partners. The company was backed by DCVC and other investors;
  it entered insolvency and was wound down through an Assignment for the Benefit of
  Creditors in late 2025. MycoWorks operates as a physical-materials manufacturer and
  publishes no public developer API, OpenAPI definition, SDK, or developer portal, so
  this API Evangelist profile carries company identity only.
